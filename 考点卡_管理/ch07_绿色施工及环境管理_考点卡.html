<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第7章 绿色施工及环境管理 · 考点卡</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --line:#e2e0d8; --line2:#cfccc2;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#8c8a82;
  --blue:#185fa5; --blue-bg:#e6f1fb;
  --teal:#0f6e56; --teal-bg:#e1f5ee;
  --amber:#854f0b; --amber-bg:#faeeda;
  --red:#a32d2d; --red-bg:#fcebeb;
  --purple:#534ab7; --purple-bg:#eeedfe;
  --gray:#6b6b66; --gray-bg:#efeee9;
  --top:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:15px; line-height:1.7;
  padding:0 20px 80px; padding-top:calc(var(--top) + 26px);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top);z-index:60;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(246,245,241,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.back{
  font-size:13px;color:var(--tx2);text-decoration:none;white-space:nowrap;
  padding:5px 10px;border-radius:7px;transition:background .15s;
}
.back:hover{background:#eceae4;color:var(--tx)}
.ch-title{font-size:13.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes{margin-left:auto;display:flex;background:#eceae4;border-radius:9px;padding:3px;gap:2px;flex-shrink:0}
.mtab{
  border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--tx2);
  padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mtab:hover{color:var(--tx)}
.mtab.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.wrap{max-width:1120px;margin:0 auto}
header.pg{margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
h1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.sub{color:var(--tx2);font-size:14px}
.sub b{color:var(--blue);font-weight:600}

/* ---------- 工具栏 ---------- */
.toolbar{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin:20px 0 16px;position:sticky;top:calc(var(--top) + 8px);z-index:20;
}
#q{
  flex:1;min-width:180px;border:1px solid var(--line2);border-radius:8px;
  padding:8px 12px;font-size:14px;font-family:inherit;color:var(--tx);
  outline:none;background:#fbfaf7;transition:border-color .15s;
}
#q:focus{border-color:var(--blue);background:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line2);background:#fff;border-radius:99px;
  padding:5px 13px;font-size:13px;color:var(--tx2);cursor:pointer;
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--tx3)}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip .n{opacity:.55;font-size:11px;margin-left:4px}

.stats{font-size:13px;color:var(--tx3);margin-bottom:14px}
.stats b{color:var(--tx);font-weight:600}

/* ---------- 索引模式 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;border-left:3px solid var(--line2);
  cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:var(--line2);box-shadow:0 1px 6px rgba(0,0,0,.045)}
.card.t-时间{border-left-color:var(--blue)}
.card.t-数字{border-left-color:var(--purple)}
.card.t-计算{border-left-color:var(--teal)}
.card.t-程序{border-left-color:var(--amber)}
.card.t-主体{border-left-color:var(--red)}
.card.t-概念{border-left-color:var(--gray)}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.t-时间 .tag{background:var(--blue-bg);color:var(--blue)}
.t-数字 .tag{background:var(--purple-bg);color:var(--purple)}
.t-计算 .tag{background:var(--teal-bg);color:var(--teal)}
.t-程序 .tag{background:var(--amber-bg);color:var(--amber)}
.t-主体 .tag{background:var(--red-bg);color:var(--red)}
.t-概念 .tag{background:var(--gray-bg);color:var(--gray)}
.sec{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.pg{margin-left:auto;font-size:11px;color:var(--tx3);background:#f2f0eb;padding:2px 7px;border-radius:4px}
.fmark{font-size:11px;color:var(--teal);background:var(--teal-bg);padding:2px 6px;border-radius:4px}

.card h3{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:10px}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:6px;font-size:14px;color:var(--tx2)}
li::before{content:"";position:absolute;left:2px;top:.65em;width:4px;height:4px;border-radius:50%;background:var(--tx3)}
li b{color:var(--tx);font-weight:600}
li .hi{background:#fff3cd;color:#633806;font-weight:600;padding:0 3px;border-radius:3px}

.trap{
  margin-top:11px;padding:9px 12px;border-radius:7px;
  background:var(--red-bg);border-left:2px solid var(--red);
  font-size:13px;color:#791f1f;
}
.trap::before{content:"易错 ";font-weight:700;font-size:11px;letter-spacing:.05em}

.card .body{display:none}
.card.open .body{display:block}
.more{font-size:12px;color:var(--tx3);margin-top:8px}
.card.open .more{display:none}
.card.open{border-color:var(--line2)}
.empty{text-align:center;color:var(--tx3);padding:60px 0;font-size:14px}

/* ---------- 配图 ---------- */
.figbox{margin:14px 0 4px}
.figbox img{
  display:block;width:100%;height:auto;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:zoom-in;transition:border-color .15s;
}
.figbox img:hover{border-color:var(--teal)}
.figcap{
  display:flex;gap:8px;align-items:baseline;margin-top:6px;
  font-size:11.5px;color:var(--tx3);line-height:1.55;
}
.figcap .fl{color:var(--teal);font-weight:600;flex-shrink:0}
.figcap .zoom{margin-left:auto;flex-shrink:0;color:var(--tx3)}

/* 灯箱 */
.lb{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(28,27,25,.9);padding:28px;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.lb.on{display:flex}
.lb img{
  max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;
  background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.lb .lbtx{color:#ddd;font-size:13px;text-align:center;max-width:760px;line-height:1.6}
.lb .lbclose{
  position:absolute;top:14px;right:20px;color:#fff;font-size:28px;line-height:1;
  background:none;border:0;cursor:pointer;opacity:.7;
}
.lb .lbclose:hover{opacity:1}

/* ---------- 知识卡片模式 ---------- */
#cardView{display:none}
.stage{
  min-height:calc(100vh - var(--top) - 70px);
  display:flex;flex-direction:column;align-items:center;
  padding-top:6px;padding-bottom:8px;
}
.stage-filter{
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
  margin-bottom:14px;flex-shrink:0;
}
.stage-filter .chip{padding:4px 12px;font-size:12.5px}

.stage-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;padding:4px 0;
}
.kcard{
  width:100%;max-width:680px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;
  border-top:4px solid var(--line2);
  padding:32px 38px 28px;
  box-shadow:0 4px 24px rgba(60,55,45,.06);
  max-height:calc(100vh - 210px);overflow-y:auto;
}
.kcard.t-时间{border-top-color:var(--blue)}
.kcard.t-数字{border-top-color:var(--purple)}
.kcard.t-计算{border-top-color:var(--teal)}
.kcard.t-程序{border-top-color:var(--amber)}
.kcard.t-主体{border-top-color:var(--red)}
.kcard.t-概念{border-top-color:var(--gray)}
.kcard.anim{animation:pop .28s cubic-bezier(.2,.7,.3,1)}
@keyframes pop{
  from{opacity:0;transform:translateY(10px) scale(.99)}
  to{opacity:1;transform:none}
}
.kc-top{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.kc-top .tag{font-size:12px;padding:3px 10px;border-radius:6px}
.kc-top .sec{font-size:12px}
.kc-top .pg{margin-left:auto;font-size:12px;padding:3px 9px}
.kc-title{font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin-bottom:18px}
.kc-list li{font-size:15.5px;line-height:1.85;margin-bottom:10px;padding-left:18px;color:var(--tx2)}
.kc-list li::before{top:.85em;width:5px;height:5px;left:3px}
.kc-list li b{color:var(--tx)}
.kc-list li .hi{font-size:16px;padding:1px 5px}
.kc-trap{
  margin-top:18px;padding:13px 15px;border-radius:9px;
  background:var(--red-bg);border-left:3px solid var(--red);
  font-size:14px;line-height:1.75;color:#791f1f;
}
.kc-trap::before{
  content:"易错";display:inline-block;font-weight:700;font-size:11px;
  letter-spacing:.06em;background:var(--red);color:#fff;
  padding:1px 7px;border-radius:4px;margin-right:8px;vertical-align:1px;
}
.kc-empty{text-align:center;color:var(--tx3);padding:70px 0}
.kcard .figbox img{max-height:40vh;width:auto;max-width:100%;margin:0 auto}

/* 翻页导航 */
.stage-nav{
  display:flex;align-items:center;gap:16px;justify-content:center;
  margin-top:18px;width:100%;max-width:680px;flex-shrink:0;
}
.navbtn{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--card);
  border-radius:10px;padding:11px 22px;font-size:14px;font-family:inherit;
  color:var(--tx2);cursor:pointer;transition:all .15s;
}
.navbtn:hover:not(:disabled){border-color:var(--tx3);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.05)}
.navbtn:active:not(:disabled){transform:translateY(1px)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.posbox{flex:1;min-width:0;text-align:center}
.posnum{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.posnum b{color:var(--tx);font-weight:600;font-size:15px}
.posbar{height:3px;background:#e6e3db;border-radius:2px;margin-top:7px;overflow:hidden}
.posbar i{display:block;height:100%;background:var(--tx2);border-radius:2px;transition:width .25s ease}
.kc-hint{text-align:center;font-size:12px;color:var(--tx3);margin-top:12px}
.kc-hint kbd{
  font-family:inherit;font-size:11px;background:#eceae4;border:1px solid var(--line2);
  border-radius:4px;padding:1px 5px;margin:0 2px;color:var(--tx2);
}

/* 打印 */
@media print{
  body{background:#fff;padding:0;font-size:12px}
  .topbar,.toolbar,.stats,.more,.stage-filter,.stage-nav,.kc-hint,.lb{display:none!important}
  .card .body{display:block!important}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{break-inside:avoid;box-shadow:none;padding:10px 12px}
  h1{font-size:18px}
  #cardView{display:none!important}
  #gridView{display:block!important}
  .figbox img{max-height:6.5cm;width:auto;max-width:100%}
}
@media(max-width:640px){
  body{padding:0 12px 60px;padding-top:calc(var(--top) + 18px)}
  h1{font-size:20px}
  .ch-title{font-size:12px;max-width:110px}
  .mtab{padding:5px 10px;font-size:12.5px}
  .grid{grid-template-columns:1fr}
  .kcard{padding:22px 18px 20px;border-radius:14px;max-height:calc(100vh - 195px)}
  .kc-title{font-size:18px;margin-bottom:14px}
  .kc-list li{font-size:14.5px;margin-bottom:8px}
  .kc-list li .hi{font-size:15px}
  .kc-trap{font-size:13.5px;padding:11px 12px}
  .stage-nav{gap:8px}
  .navbtn{padding:11px 14px;font-size:13px}
  .posnum{font-size:12px}
  .kcard .figbox img{max-height:32vh}
}
</style>
</head>
<body>

<nav class="topbar">
  <a class="back" href="../index.html#gl">← 全部章节</a>
  <div class="ch-title">第 7 章　绿色施工及环境管理</div>
  <div class="modes">
    <button class="mtab on" data-mode="grid">索引</button>
    <button class="mtab" data-mode="card">知识卡片</button>
  </div>
</nav>

<main class="wrap">

  <!-- ============ 索引模式 ============ -->
  <div id="gridView">
    <header class="pg">
      <div class="kicker">2027 二建 · 建设工程施工管理</div>
      <h1>第 7 章　绿色施工及环境管理</h1>
      <div class="sub">教材 P297–P317　·　<b id="total">0</b> 张考点卡　·　覆盖 7.1 绿色施工管理 与 7.2 施工现场环境管理</div>
      <div class="sub" style="margin-top:4px;font-size:13px;color:var(--tx3)">点击卡片展开细节；带 <span class="fmark">配图</span> 的卡片可直接看图，点图放大</div>
    </header>

    <div class="toolbar">
      <input id="q" type="search" placeholder="搜索考点关键词，如：时限、比例、网络计划……">
      <div class="chips" id="chips"></div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="grid" id="list"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的考点，换个关键词试试</div>
  </div>

  <!-- ============ 知识卡片模式 ============ -->
  <div id="cardView">
    <div class="stage">
      <div class="stage-filter" id="chips2"></div>
      <div class="stage-body">
        <div class="kcard" id="kcard"></div>
      </div>
      <div class="stage-nav">
        <button class="navbtn" id="prev">← 上一张</button>
        <div class="posbox">
          <div class="posnum"><b id="pos">1</b> / <span id="posAll">1</span></div>
          <div class="posbar"><i id="posfill" style="width:0%"></i></div>
        </div>
        <button class="navbtn" id="next">下一张 →</button>
      </div>
      <div class="kc-hint">键盘 <kbd>←</kbd> <kbd>→</kbd> 翻页　·　<kbd>空格</kbd> 切回索引　·　点图放大</div>
    </div>
  </div>

</main>

<div class="lb" id="lb">
  <button class="lbclose" id="lbclose">×</button>
  <img id="lbimg" alt="">
  <div class="lbtx" id="lbtx"></div>

<script>

pan class='hi'>20min<\/span> 的等效声级，夜间同时测量最大声级"], "x": "场界外1.0m、离地1.2m，这两个数字最容易写反。"}, {"t": "程序", "s": "7.1.2", "p": "P305", "n": "夜间施工的限制与例外", "k": ["噪声敏感建筑物集中区域禁止夜间进行产生噪声的施工作业", "抢修抢险，或因生产工艺要求、其他特殊需要必须连续施工的除外", "因特殊需要连续施工的，应取得住建、生态环境等主管部门的证明", "取得证明后应在施工现场显著位置公示或以其他方式公告附近居民"], "x": "例外不等于自由施工：须先取得证明并公告居民，缺一即属违法夜间施工。"}, {"t": "概念", "s": "7.1.2", "p": "P305", "n": "施工光污染控制措施", "k": ["应根据现场和周边环境采取限时施工、遮光和全封闭等措施", "夜间室外照明灯应加设灯罩，透光方向集中在施工范围", "光线作用敏感区域，电焊作业和大型照明灯具应采取防光外泄措施"], "x": "限时施工、遮光、全封闭是三类措施，不能只记“加灯罩”。"}, {"t": "概念", "s": "7.1.2", "p": "P306", "n": "污水排放与地下水保护", "k": ["施工现场污水排放应达到《污水综合排放标准》GB 8978-1996 的要求", "食堂设隔油池、固定厕所设化粪池，两者应做防渗处理并定期清运消毒", "清洗机具的废水和废油不得直接排放，污水应委托有资质单位检测并出具报告", "基坑开挖抽水量大于 <span class='hi'>50万m³<\/span> 时应进行地下水回灌，并避免污染"], "x": "50万m³是抽水量阈值，超过才回灌；隔油池配食堂、化粪池配厕所，不可混。"}, {"t": "数字", "s": "7.1.2", "p": "P306", "n": "建筑垃圾回收利用指标", "k": ["力争使建筑垃圾的再利用和回收率达到 <span class='hi'>30%<\/span>", "建筑物拆除产生的废弃物再利用和回收率大于 <span class='hi'>40%<\/span>", "碎石类、土石方类建筑垃圾力争再利用率大于 <span class='hi'>50%<\/span>", "有毒有害废弃物的分类率应达到 <span class='hi'>100%<\/span>"], "x": "30%、40%、50% 依次对应建筑垃圾、拆除废弃物、碎石土石方，逐级提高。"}, {"t": "概念", "s": "7.2.1", "p": "P307", "n": "环境管理体系标准与核心内容", "k": ["国际标准为 ISO 14001:2015，我国等同采用为 GB/T 24001-2016", "标准含范围、引用文件、术语定义、组织环境、领导作用、策划、支持、运行、绩效评价、改进10部分", "领导作用与策划、支持运行、绩效评价、改进四部分紧密联系并处于核心地位", "绩效评价含监视测量分析评价、内部审核、管理评审三方面"], "x": "我国标准号是 GB/T 24001-2016，与 ISO 14001:2015 编号不同，不可混用。"}, {"t": "程序", "s": "7.2.1", "p": "P311", "n": "环境管理体系的运行程序", "k": ["体系文件经最高管理者评审批准后正式发布，即进入试运行阶段", "通过试运行在实践中检验体系的适宜性、符合性和有效性，及时纠正不符合", "试运行一段时间后开展内部审核，检查体系运行的符合性和有效性", "最高管理者按确定的时间间隔开展管理评审，评价持续适宜性、充分性和有效性"], "x": "顺序是试运行→纠正不符合→内部审核→管理评审，内审在前、评审在后。"}, {"t": "概念", "s": "7.2.2", "p": "P313", "n": "文明施工8S管理要素", "k": ["5S为整理、整顿、清扫、清洁、素养，罗马发音均以S打头", "整理是区分必要与冗余；整顿是科学定置定位，如工具“三定”定点定容定量", "在5S基础上增加安全Safety要素即为6S", "再增加节约Save和学习Study两大要素，成为8S"], "x": "8S=5S+安全+节约+学习；安全和节约是后加的，不属于5S。"}, {"t": "数字", "s": "7.2.2", "p": "P315", "n": "施工现场围挡高度要求", "k": ["市区主要路段的工地应设置高度不小于 <span class='hi'>2.5m<\/sp const DATA = BANK.cards;
const FIGS = BANK.figs || {};
const CH = BANK.chapter;
const TYPES = ["时间","数字","计算","程序","主体","概念"];

let activeType = "全部", keyword = "";
let cur = 0;
let mode = "grid";

const $ = id => document.getElementById(id);

function figHTML(d, compact){
  if(!d.fig || !FIGS[d.fig]) return "";
  const F = FIGS[d.fig];
  return `<figure class="figbox">
    <img src="${F.src}" alt="${F.cap||''}" data-fig="${d.fig}" loading="lazy">
    <figcaption class="figcap">
      <span class="fl">配图</span>
      <span>${F.cap||''}</span>
      <span class="zoom">教材 ${F.p}　点击放大</span>
    </figcaption>
  </figure>`;
}

function filtered(){
  const kw = keyword.trim().toLowerCase();
  return DATA.filter(d=>{
    if(activeType !== "全部" && d.t !== activeType) return false;
    if(!kw) return true;
    const hay = (d.n + " " + d.s + " " + d.p + " " + d.k.join(" ") + " " + (d.x||"")).replace(/<[^>]+>/g,"").toLowerCase();
    return hay.includes(kw);
  });
}

function chipHTML(){
  const counts = {};
  TYPES.forEach(t=>counts[t] = DATA.filter(d=>d.t===t).length);
  const items = [["全部", DATA.length], ...TYPES.filter(t=>counts[t]).map(t=>[t,counts[t]])];
  return items.map(([t,n])=>
    `<button class="chip${t===activeType?" on":""}" data-t="${t}">${t}<span class="n">${n}</span></button>`
  ).join("");
}
function bindChips(box){
  box.querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ activeType = b.dataset.t; cur = 0; renderChips(); renderGrid(); renderCard(); };
  });
}
function renderChips(){
  const a = $("chips"), b = $("chips2");
  if(a){ a.innerHTML = chipHTML(); bindChips(a); }
  if(b){ b.innerHTML = chipHTML(); bindChips(b); }
}

/* ---------------- 索引模式 ---------------- */
function renderGrid(){
  const rows = filtered();
  const kw = keyword.trim();
  $("total").textContent = DATA.length;
  $("stats").innerHTML = (kw || activeType!=="全部")
    ? `筛选出 <b>${rows.length}</b> 张考点卡` + (kw?`，关键词「${kw.replace(/</g,"&lt;")}」`:"") + `　·　共 ${DATA.length} 张`
    : `共 <b>${DATA.length}</b> 张考点卡　·　${BANK.summary}`;

  $("empty").style.display = rows.length ? "none" : "block";
  $("list").innerHTML = rows.map(d=>`
    <div class="card t-${d.t}">
      <div class="card-top">
        <span class="tag">${d.t}</span>
        <span class="sec">${d.s||""}</span>
        ${d.fig && FIGS[d.fig] ? '<span class="fmark">配图</span>' : ''}
        <span class="pg">${d.p||""}</span>
      </div>
      <h3>${d.n}</h3>
      <div class="body">
        <ul>${d.k.map(x=>`<li>${x}</li>`).join("")}</ul>
        ${figHTML(d)}
        ${d.x?`<div class="trap">${d.x}</div>`:""}
      </div>
      <div class="more">点击展开 ▾</div>
    </div>`).join("");

  $("list").querySelectorAll(".card").forEach(c=>{
    c.onclick = (e)=>{ if(e.target.closest(".figbox")) return; c.classList.toggle("open"); };
  });
  bindZoom($("list"));
}

/* ---------------- 知识卡片模式 ---------------- */
function renderCard(){
  const rows = filtered();
  const box = $("kcard");
  $("posAll").textContent = rows.length || 0;

  if(!rows.length){
    box.className = "kcard";
    box.innerHTML = `<div class="kc-empty">当前筛选下没有卡片</div>`;
    $("pos").textContent = "0";
    $("posfill").style.width = "0%";
    $("prev").disabled = $("next").disabled = true;
    return;
  }
  if(cur >= rows.length) cur = rows.length - 1;
  if(cur < 0) cur = 0;

  const d = rows[cur];
  box.className = "kcard t-" + d.t;
  box.innerHTML = `
    <div class="kc-top">
      <span class="tag">${d.t}</span>
      <span class="sec">${d.s||""}</span>
      <span class="pg">${d.p||""}</span>
    </div>
    <h2 class="kc-title">${d.n}</h2>
    <ul class="kc-list">${d.k.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${figHTML(d, true)}
    ${d.x?`<div class="kc-trap">${d.x}</div>`:""}
  `;
  box.scrollTop = 0;
  box.classList.remove("anim"); void box.offsetWidth; box.classList.add("anim");

  $("pos").textContent = cur + 1;
  $("posfill").style.width = ((cur+1)/rows.length*100).toFixed(1) + "%";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === rows.length - 1;
  bindZoom(box);
  try{ localStorage.setItem("kb_pos_ch"+CH, cur); }catch(e){}
}

function go(n){
  const rows = filtered();
  if(!rows.length) return;
  const t = cur + n;
  if(t < 0 || t >= rows.length) return;
  cur = t; renderCard();
}

/* ---------------- 灯箱 ---------------- */
function bindZoom(scope){
  scope.querySelectorAll(".figbox img").forEach(img=>{
    img.onclick = (e)=>{
      e.stopPropagation();
      const F = FIGS[img.dataset.fig] || {};
      $("lbimg").src = F.src || img.src;
      $("lbtx").textContent = F.cap || "";
      $("lb").classList.add("on");
    };
  });
}
function closeLB(){ $("lb").classList.remove("on"); }
$("lb").onclick = closeLB;
$("lbclose").onclick = (e)=>{ e.stopPropagation(); closeLB(); };

/* ---------------- 模式切换 ---------------- */
function setMode(m){
  mode = m;
  document.querySelectorAll(".mtab").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  $("gridView").style.display = m==="grid" ? "block" : "none";
  $("cardView").style.display = m==="card" ? "block" : "none";
  if(m==="card"){
    if(!window.__restored){
      const saved = (window.__posParam != null)
        ? window.__posParam
        : parseInt(localStorage.getItem("kb_pos_ch"+CH)||"0", 10);
      const rows = filtered();
      cur = Math.min(Math.max(saved||0,0), Math.max(rows.length-1,0));
      window.__restored = true;
    }
    renderCard();
    window.scrollTo({top:0, behavior:"auto"});
  }else{
    renderGrid();
  }
  try{ localStorage.setItem("kb_mode", m); }catch(e){}
}
document.querySelectorAll(".mtab").forEach(b=>{
  b.onclick = ()=> setMode(b.dataset.mode);
});

/* ---------------- 事件 ---------------- */
$("q").addEventListener("input", e=>{
  keyword = e.target.value; cur = 0; renderGrid();
  if(mode==="card") renderCard();
});
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);

document.addEventListener("keydown", e=>{
  if($("lb").classList.contains("on")){
    if(e.key === "Escape") closeLB();
    return;
  }
  const inInput = document.activeElement && document.activeElement.tagName === "INPUT";
  if(e.key === "/" && !inInput && mode==="grid"){
    e.preventDefault(); $("q").focus(); return;
  }
  if(mode === "card" && !inInput){
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === " "){ e.preventDefault(); setMode("grid"); }
    else if(e.key === "Escape"){ setMode("grid"); }
  }
});

/* 触摸滑动（图片上不触发，避免与放大冲突） */
let tx = 0, ty = 0;
const stage = document.querySelector(".stage-body");
stage.addEventListener("touchstart", e=>{
  if(e.target.closest(".figbox")) return;
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, {passive:true});
stage.addEventListener("touchend", e=>{
  if(e.target.closest(".figbox")) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.6) go(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------------- 初始化 ---------------- */
renderChips();
renderGrid();
let initMode = "grid";
try{ initMode = localStorage.getItem("kb_mode") || "grid"; }catch(e){}
const sp = new URLSearchParams(location.search);
if(sp.get("mode")) initMode = sp.get("mode");
if(sp.get("i") != null) window.__posParam = Math.max(parseInt(sp.get("i"), 10) || 0, 0);
setMode(initMode);
</script>
</body>
