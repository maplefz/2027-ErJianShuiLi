<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3章 水利水电工程主体工程施工 · 考点卡</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --line:#e2e0d8; --line2:#cfccc2;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#8c8a82;
  --blue:#185fa5; --blue-bg:#e6f1fb;
  --teal:#0f6e56; --teal-bg:#e1f5ee;
  --amber:#854f0b; --amber-bg:#faeeda;
  --red:#a32d2d; --red-bg:#fcebeb;
  --purple:#534ab7; --purple-bg:#eeedfe;
  --gray:#6b6b66; --gray-bg:#efeee9;
  --top:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:15px; line-height:1.7;
  padding:0 20px 80px; padding-top:calc(var(--top) + 26px);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top);z-index:60;
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:rgba(246,245,241,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.back{
  font-size:13px;color:var(--tx2);text-decoration:none;white-space:nowrap;
  padding:5px 10px;border-radius:7px;transition:background .15s;
}
.back:hover{background:#eceae4;color:var(--tx)}
.ch-title{font-size:13.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modes{margin-left:auto;display:flex;background:#eceae4;border-radius:9px;padding:3px;gap:2px;flex-shrink:0}
.mtab{
  border:0;background:transparent;font-family:inherit;font-size:13px;color:var(--tx2);
  padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mtab:hover{color:var(--tx)}
.mtab.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

.wrap{max-width:1120px;margin:0 auto}
header.pg{margin-bottom:22px}
.kicker{font-size:12px;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;margin-bottom:8px}
h1{font-size:25px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.sub{color:var(--tx2);font-size:14px}
.sub b{color:var(--blue);font-weight:600}

/* ---------- 工具栏 ---------- */
.toolbar{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;margin:20px 0 16px;position:sticky;top:calc(var(--top) + 8px);z-index:20;
}
#q{
  flex:1;min-width:180px;border:1px solid var(--line2);border-radius:8px;
  padding:8px 12px;font-size:14px;font-family:inherit;color:var(--tx);
  outline:none;background:#fbfaf7;transition:border-color .15s;
}
#q:focus{border-color:var(--blue);background:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line2);background:#fff;border-radius:99px;
  padding:5px 13px;font-size:13px;color:var(--tx2);cursor:pointer;
  font-family:inherit;transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--tx3)}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.chip .n{opacity:.55;font-size:11px;margin-left:4px}

.stats{font-size:13px;color:var(--tx3);margin-bottom:14px}
.stats b{color:var(--tx);font-weight:600}

/* ---------- 索引模式 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;border-left:3px solid var(--line2);
  cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.card:hover{border-color:var(--line2);box-shadow:0 1px 6px rgba(0,0,0,.045)}
.card.t-时间{border-left-color:var(--blue)}
.card.t-数字{border-left-color:var(--purple)}
.card.t-计算{border-left-color:var(--teal)}
.card.t-程序{border-left-color:var(--amber)}
.card.t-主体{border-left-color:var(--red)}
.card.t-概念{border-left-color:var(--gray)}

.card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.t-时间 .tag{background:var(--blue-bg);color:var(--blue)}
.t-数字 .tag{background:var(--purple-bg);color:var(--purple)}
.t-计算 .tag{background:var(--teal-bg);color:var(--teal)}
.t-程序 .tag{background:var(--amber-bg);color:var(--amber)}
.t-主体 .tag{background:var(--red-bg);color:var(--red)}
.t-概念 .tag{background:var(--gray-bg);color:var(--gray)}
.sec{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.pg{margin-left:auto;font-size:11px;color:var(--tx3);background:#f2f0eb;padding:2px 7px;border-radius:4px}
.fmark{font-size:11px;color:var(--teal);background:var(--teal-bg);padding:2px 6px;border-radius:4px}

.card h3{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:10px}
ul{list-style:none}
li{position:relative;padding-left:15px;margin-bottom:6px;font-size:14px;color:var(--tx2)}
li::before{content:"";position:absolute;left:2px;top:.65em;width:4px;height:4px;border-radius:50%;background:var(--tx3)}
li b{color:var(--tx);font-weight:600}
li .hi{background:#fff3cd;color:#633806;font-weight:600;padding:0 3px;border-radius:3px}

.trap{
  margin-top:11px;padding:9px 12px;border-radius:7px;
  background:var(--red-bg);border-left:2px solid var(--red);
  font-size:13px;color:#791f1f;
}
.trap::before{content:"易错 ";font-weight:700;font-size:11px;letter-spacing:.05em}

.card .body{display:none}
.card.open .body{display:block}
.more{font-size:12px;color:var(--tx3);margin-top:8px}
.card.open .more{display:none}
.card.open{border-color:var(--line2)}
.empty{text-align:center;color:var(--tx3);padding:60px 0;font-size:14px}

/* ---------- 配图 ---------- */
.figbox{margin:14px 0 4px}
.figbox img{
  display:block;width:100%;height:auto;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:zoom-in;transition:border-color .15s;
}
.figbox img:hover{border-color:var(--teal)}
.figcap{
  display:flex;gap:8px;align-items:baseline;margin-top:6px;
  font-size:11.5px;color:var(--tx3);line-height:1.55;
}
.figcap .fl{color:var(--teal);font-weight:600;flex-shrink:0}
.figcap .zoom{margin-left:auto;flex-shrink:0;color:var(--tx3)}

/* 灯箱 */
.lb{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(28,27,25,.9);padding:28px;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
.lb.on{display:flex}
.lb img{
  max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;
  background:#fff;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.lb .lbtx{color:#ddd;font-size:13px;text-align:center;max-width:760px;line-height:1.6}
.lb .lbclose{
  position:absolute;top:14px;right:20px;color:#fff;font-size:28px;line-height:1;
  background:none;border:0;cursor:pointer;opacity:.7;
}
.lb .lbclose:hover{opacity:1}

/* ---------- 知识卡片模式 ---------- */
#cardView{display:none}
.stage{
  min-height:calc(100vh - var(--top) - 70px);
  display:flex;flex-direction:column;align-items:center;
  padding-top:6px;padding-bottom:8px;
}
.stage-filter{
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
  margin-bottom:14px;flex-shrink:0;
}
.stage-filter .chip{padding:4px 12px;font-size:12.5px}

.stage-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  width:100%;padding:4px 0;
}
.kcard{
  width:100%;max-width:680px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;
  border-top:4px solid var(--line2);
  padding:32px 38px 28px;
  box-shadow:0 4px 24px rgba(60,55,45,.06);
  max-height:calc(100vh - 210px);overflow-y:auto;
}
.kcard.t-时间{border-top-color:var(--blue)}
.kcard.t-数字{border-top-color:var(--purple)}
.kcard.t-计算{border-top-color:var(--teal)}
.kcard.t-程序{border-top-color:var(--amber)}
.kcard.t-主体{border-top-color:var(--red)}
.kcard.t-概念{border-top-color:var(--gray)}
.kcard.anim{animation:pop .28s cubic-bezier(.2,.7,.3,1)}
@keyframes pop{
  from{opacity:0;transform:translateY(10px) scale(.99)}
  to{opacity:1;transform:none}
}
.kc-top{display:flex;align-items:center;gap:9px;margin-bottom:15px}
.kc-top .tag{font-size:12px;padding:3px 10px;border-radius:6px}
.kc-top .sec{font-size:12px}
.kc-top .pg{margin-left:auto;font-size:12px;padding:3px 9px}
.kc-title{font-size:21px;font-weight:600;line-height:1.45;letter-spacing:-.01em;margin-bottom:18px}
.kc-list li{font-size:15.5px;line-height:1.85;margin-bottom:10px;padding-left:18px;color:var(--tx2)}
.kc-list li::before{top:.85em;width:5px;height:5px;left:3px}
.kc-list li b{color:var(--tx)}
.kc-list li .hi{font-size:16px;padding:1px 5px}
.kc-trap{
  margin-top:18px;padding:13px 15px;border-radius:9px;
  background:var(--red-bg);border-left:3px solid var(--red);
  font-size:14px;line-height:1.75;color:#791f1f;
}
.kc-trap::before{
  content:"易错";display:inline-block;font-weight:700;font-size:11px;
  letter-spacing:.06em;background:var(--red);color:#fff;
  padding:1px 7px;border-radius:4px;margin-right:8px;vertical-align:1px;
}
.kc-empty{text-align:center;color:var(--tx3);padding:70px 0}
.kcard .figbox img{max-height:40vh;width:auto;max-width:100%;margin:0 auto}

/* 翻页导航 */
.stage-nav{
  display:flex;align-items:center;gap:16px;justify-content:center;
  margin-top:18px;width:100%;max-width:680px;flex-shrink:0;
}
.navbtn{
  flex:0 0 auto;border:1px solid var(--line2);background:var(--card);
  border-radius:10px;padding:11px 22px;font-size:14px;font-family:inherit;
  color:var(--tx2);cursor:pointer;transition:all .15s;
}
.navbtn:hover:not(:disabled){border-color:var(--tx3);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.05)}
.navbtn:active:not(:disabled){transform:translateY(1px)}
.navbtn:disabled{opacity:.35;cursor:not-allowed}
.posbox{flex:1;min-width:0;text-align:center}
.posnum{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.posnum b{color:var(--tx);font-weight:600;font-size:15px}
.posbar{height:3px;background:#e6e3db;border-radius:2px;margin-top:7px;overflow:hidden}
.posbar i{display:block;height:100%;background:var(--tx2);border-radius:2px;transition:width .25s ease}
.kc-hint{text-align:center;font-size:12px;color:var(--tx3);margin-top:12px}
.kc-hint kbd{
  font-family:inherit;font-size:11px;background:#eceae4;border:1px solid var(--line2);
  border-radius:4px;padding:1px 5px;margin:0 2px;color:var(--tx2);
}

/* 打印 */
@media print{
  body{background:#fff;padding:0;font-size:12px}
  .topbar,.toolbar,.stats,.more,.stage-filter,.stage-nav,.kc-hint,.lb{display:none!important}
  .card .body{display:block!important}
  .grid{grid-template-columns:1fr 1fr;gap:8px}
  .card{break-inside:avoid;box-shadow:none;padding:10px 12px}
  h1{font-size:18px}
  #cardView{display:none!important}
  #gridView{display:block!important}
  .figbox img{max-height:6.5cm;width:auto;max-width:100%}
}
@media(max-width:640px){
  body{padding:0 12px 60px;padding-top:calc(var(--top) + 18px)}
  h1{font-size:20px}
  .ch-title{font-size:12px;max-width:110px}
  .mtab{padding:5px 10px;font-size:12.5px}
  .grid{grid-template-columns:1fr}
  .kcard{padding:22px 18px 20px;border-radius:14px;max-height:calc(100vh - 195px)}
  .kc-title{font-size:18px;margin-bottom:14px}
  .kc-list li{font-size:14.5px;margin-bottom:8px}
  .kc-list li .hi{font-size:15px}
  .kc-trap{font-size:13.5px;padding:11px 12px}
  .stage-nav{gap:8px}
  .navbtn{padding:11px 14px;font-size:13px}
  .posnum{font-size:12px}
  .kcard .figbox img{max-height:32vh}
}
</style>
</head>
<body>

<nav class="topbar">
  <a class="back" href="../index.html#sl">← 全部章节</a>

</nav>

<main class="wrap">

  <!-- ============ 索引模式 ============ -->
  <div id="gridView">
    <header class="pg">
      <div class="kicker">2027 二建 · 水利水电工程管理与实务</div>
      <h1>第 3 章　水利水电工程主体工程施工</h1>

    </header>

    <div class="toolbar">

    <div class="stats" id="stats"></div>
    <div class="grid" id="list"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的考点，换个关键词试试</div>
  </div>

  <!-- ============ 知识卡片模式 ============ -->
  <div id="cardView">
    <div class="stage">
      <div class="stage-filter" id="chips2"></div>

        <button class="navbtn" id="next">下一张 →</button>
      </div>
      <div class="kc-hint">键盘 <kbd>←</kbd> <kbd>→</kbd> 翻页　·　<kbd>空格</kbd> 切回索引　·　点图放大</div>

  </div>

</main>

<div class="lb" id="lb">
  <button class="lbclose" id="lbclose">×</button>
  <img id="lbimg" alt="">
  <div class="lbtx" id="lbtx"></div>
</div>

<script>
const BANK = {"chapter": 3, "name": "水利水电工程主体工程施工", "pages": "P90–P170", "summary": "覆盖 3.1 土石方开挖 至 3.6 单项工程施工", "cards": [{"t": "概念", "s": "3.1.1", "p": "P90", "n": "土的工程分类（四类）", "k": ["水利水电工程施工中常用土的工程分类，依开挖方法、开挖难易程度等分为<span class='hi'>4类<\/span>", "用铁锹或略加脚踩开挖的土为Ⅰ类，用铁锹且需用脚踩开挖的土为Ⅱ类", "用镐、三齿耙开挖或用锹需用力加脚踩开挖的为Ⅲ类，用镐、三齿耙等开挖的为Ⅳ类"], "x": "分类依据是开挖方法与开挖难易程度，不是颗粒级配；Ⅰ类最松软、Ⅳ类最坚硬。"}, {"t": "主体", "s": "3.1.1", "p": "P91", "n": "正铲与反铲挖掘机的挖土特点", "k": ["正铲向前向上、强制切土，主要挖掘停机面以上的掌子，适用Ⅰ～Ⅳ类土及爆破石渣", "正铲侧向开挖时挖掘机回转角度小，生产效率高", "反铲向后向下、强制切土，主要挖掘停机面以下的掌子，适用Ⅰ～Ⅲ类土", "反铲斗容量较正铲小，工作循环时间比正铲长<span class='hi'>8%～30%<\/span>，多用于深度不大的基槽"], "x": "正铲挖停机面以上、反铲挖停机面以下，方向记反则整个机械选型都错。"}, {"t": "数字", "s": "3.1.1", "p": "P92", "n": "推土机与铲运机的适用运距", "k": ["推土机宜用于<span class='hi'>100m以内<\/span>运距、Ⅰ～Ⅲ类土的挖运", "推土机挖深不宜大于1.5～2.0m，填高不宜大于2～3m", "拖式铲运机经济运距为<span class='hi'>500m以内<\/span>，自行式轮胎铲运机为800～1500m", "推土机开行基本是穿梭式，可采用槽形开挖、分段铲土、集中推运、多机并列推土"], "x": "100m、500m、1500m 三个运距界限分别对应推土机、拖式、自行式铲运机。"}, {"t": "数字", "s": "3.1.1", "p": "P93", "n": "人工开挖的保护层与排水", "k": ["处于河床或地下水位以下的建筑物基础开挖，应先开挖排水沟，再分层下挖", "临近设计高程时应留出<span class='hi'>0.2～0.3m<\/span>的保护层暂不开挖，待上部结构施工时再挖除", "呈线状布置的工程（溢洪道、渠道）宜采用分段施工的平行流水作业组织开挖", "分段长度可按一个工作小组在一个工作班内能完成的挖方量来考虑"], "x": "保护层是留给上部结构施工前挖除的，不是永久保留层，也不能一次挖到设计高程。"}, {"t": "程序", "s": "3.1.1", "p": "P93", "n": "渠道开挖的施工方法", "k": ["干地上开挖渠道应自中心向外、分层下挖，边坡处按边坡比挖成台阶状", "待挖至设计深度后，再按设计边坡统一进行削坡", "受地下水影响的渠道应设排水沟，开挖方式有一次到底法和分层下挖法", "推土机开挖渠道挖深不宜超过1.5～2.0m，其坡度不宜陡于<span class='hi'>1:2<\/span>"], "x": "先挖成台阶状、后统一削坡；顺序颠倒会造成超挖并使边坡失去支撑。"}, {"t": "数字", "s": "3.1.2", "p": "P95", "n": "岩石的坚固系数分级", "k": ["岩石根据坚固系数的大小分级，前10级（Ⅴ～ⅩⅣ）的坚固系数在<span class='hi'>1.5～20<\/span>", "除Ⅴ级的坚固系数为1.5～2.0外，其余以<span class='hi'>2<\/span>为级差", "坚固系数在20～25为ⅩⅤ级，坚固系数在25以上为ⅩⅥ级"], "x": "Ⅴ级是唯一的半级（1.5～2.0），其余按级差2递增，最容易记错。"}, {"t": "主体", "s": "3.1.2", "p": "P95", "n": "浅孔爆破及炮孔布置原则", "k": ["孔径小于75mm、深度小于5m的钻孔爆破称为浅孔爆破", "炮孔方向不宜与最小抵抗线方向重合，否则爆生气体易冲出、爆破效果大为降低", "炮孔应与层面、节理垂直或斜交，但不宜穿过较宽裂隙以免漏气", "多排炮孔应交错布置成梅花形，第一排先爆，其后各排依次爆破"], "x": "浅孔与深孔以孔径75mm、孔深5m双控，两个条件同时满足才成立。"}, {"t": "计算", "s": "3.1.2", "p": "P96", "n": "深孔爆破的参数与倾斜钻孔", "k": ["孔径大于75mm、孔深大于5m的钻孔爆破称为深孔爆破，一般适用Ⅳ～ⅩⅣ级岩石", "主要参数有梯段高度、底盘抵抗线、孔间距a和排距b、超钻深度h、钻孔深度L及单孔装药量Q", "倾斜钻孔岩石破碎均匀、大块率低、不易留埂坎，梯段坡面平整稳定", "提高爆破质量可采用多排孔微差爆破和挤压爆破"], "x": "参数是看图推演型考点，梯段高度、抵抗线、a、b、h、L、Q 缺一不可。"}, {"t": "概念", "s": "3.1.2", "p": "P96", "n": "预裂爆破与光面爆破的区别", "k": ["预裂爆破沿设计开挖轮廓线钻一排孔，在主体爆破之前先行起爆形成贯穿裂缝", "预裂炮孔角度应与开挖轮廓边坡坡度一致，宜一次钻到设计深度", "光面爆破先爆主体，最后爆破轮廓线上的光爆层，获得平整开挖壁面", "地下洞室开挖选择光面爆破较多，高地应力区地下洞室光面爆破效果更好"], "x": "预裂先爆成缝、光面后爆修面，起爆时序颠倒即失分。"}, {"t": "数字", "s": "3.2.1", "p": "P97", "n": "土坝地基岸坡的开挖要求", "k": ["坝断面范围内必须清除草皮、树根、含植物的表土、垃圾等，并将清理后的表面土层压实", "开挖的岸坡应大致平顺，不应呈台阶状、反坡或突然变坡", "岸坡上缓下陡时，变坡角应小于<span class='hi'>20°<\/span>，岸坡不宜陡于1:1.5", "应留有0.2～0.3m的保护层，待填土前进行人工开挖"], "x": "土基岸坡1:1.5、岩基岸坡1:0.5，两个坡度值切勿互换。"}, {"t": "数字", "s": "3.2.1", "p": "P97", "n": "混凝土坝地基的开挖深度", "k": ["高坝应挖至新鲜或微风化基岩，中坝宜挖至微风化或弱风化基岩", "开挖至距离基岩面<span class='hi'>0.5～1.0m<\/span>时，应采用手风钻钻孔、小药量爆破", "遇易风化的页岩、黏土岩时，应留0.2～0.3m保护层，待浇筑混凝土前再挖除", "坝段的基础面上下游高差不宜过大，并尽可能开挖成大台阶状"], "x": "0.5～1.0m 是小药量爆破控制段，0.2～0.3m 是保护层，两者作用不同。"}, {"t": "概念", "s": "3.2.2", "p": "P98", "n": "固结灌浆与帷幕灌浆的区别", "k": ["固结灌浆面状布孔，改善岩基力学性能、减少变形和不均匀沉陷，面积大、深度浅、压力小", "帷幕灌浆平行建筑物轴线钻一排或几排孔，形成防渗帷幕、截断渗流、降低扬压力", "帷幕灌浆的灌浆深度较深、灌浆压力较大，与固结灌浆正好相反", "固结灌浆压力一般控制在<span class='hi'>0.3～0.5MPa<\/span>"], "x": "截断渗流、降低扬压力是帷幕灌浆的目的，常被错记到固结灌浆头上。"}, {"t": "概念", "s": "3.2.2", "p": "P98", "n": "接触灌浆的作用", "k": ["接触灌浆是在建筑物和岩石接触面之间进行的灌浆", "目的是加强两者间的结合程度和基础的整体性，提高抗滑稳定性", "在加强结合的同时，也增进岩石固结与防渗性能"], "x": "接触灌浆解决的是结合面，不处理深层裂隙，与固结、帷幕的作用对象不同。"}, {"t": "概念", "s": "3.2.2", "p": "P98", "n": "高压喷射灌浆的原理", "k": ["采用钻孔将装上特制合金喷嘴的注浆管下到预定位置", "用高压泵把浆液经喷嘴喷射出来，冲击破坏土体", "土粒在喷射流束的冲击力、离心力和重力综合作用下与浆液搅拌混合", "浆液凝固以后，在土内形成一定形状的固结体"], "x": "高压喷射灌浆是就地搅拌混合成固结体，不是把浆液压进岩体裂隙。"}, {"t": "概念", "s": "3.2.3", "p": "P100", "n": "纯压式与循环式灌浆", "k": ["纯压式是一次把浆液压入钻孔中，浆液单向从灌浆机向钻孔流动", "循环式是浆液进入钻孔，一部分压入地基缝隙，另一部分由回浆管路返回拌浆筒", "化学灌浆浆液中不存在固体颗粒的沉淀问题，故都采用纯压式灌浆"], "x": "两者区别在有无回浆管路；循环式可据回浆判断吸浆量，纯压式设备简单。", "fig": "ch03f01"}, {"t": "程序", "s": "3.2.3", "p": "P100", "n": "固结灌浆的施工程序", "k": ["施工程序依次是钻孔、压水试验、灌浆（分序施工）、封孔和质量检查", "压水试验采用单点法，试验孔数一般不宜少于总孔数的<span class='hi'>5%<\/span>", "封孔采用置换和压力灌浆封孔法，先将孔内余浆置换成浓浆再压力灌浆封孔", "检查不符合要求的，可通过加密钻孔补充灌浆，以达到要求"], "x": "灌前压水是简易压水试验，与灌后质量检查的压水试验不是同一回事。"}, {"t": "程序", "s": "3.2.3", "p": "P101", "n": "灌浆施工的先后顺序", "k": ["有盖重的坝基固结灌浆应在混凝土达到设计强度后进行", "基础灌浆宜按照<span class='hi'>先固结、后帷幕<\/span>的顺序进行", "水工隧洞中的灌浆宜按先回填灌浆、后固结灌浆、再接缝灌浆的顺序进行"], "x": "固结在前、帷幕在后；隧洞回填最先。顺序颠倒会抬动混凝土或压裂已灌帷幕。"}, {"t": "程序", "s": "3.2.3", "p": "P101", "n": "帷幕灌浆浆液浓度的控制", "k": ["灌浆过程中必须根据吸浆量的变化情况，适时调整浆液的浓度", "开始时用最稀一级浆液，而不是先浓后稀", "灌入一定浆量后若吸浆量没有明显减少，即改为用浓一级的浆液灌注", "如此逐级变浓下去，直到灌浆结束为止"], "x": "判断依据是吸浆量是否明显减少，不是灌浆时间的长短。"}, {"t": "概念", "s": "3.2.4", "p": "P102", "n": "防渗墙的结构形式", "k": ["按墙体结构形式分桩柱形、槽孔形和混合形三类，其中槽孔形防渗墙使用更为广泛", "较浅的透水地基用黏土截水槽，下游设反滤层", "较深的透水地基用槽孔型或桩柱体防渗墙，分别由槽孔、桩柱套接而成", "按布置方式分嵌固式、悬挂式和组合式防渗墙"], "x": "槽孔型是壁板式、桩柱型是柱列式，套接单元不同，不能张冠李戴。", "fig": "ch03f02"}, {"t": "数字", "s": "3.2.4", "p": "P102", "n": "防渗墙成槽与质量检查", "k": ["成槽方法有钻劈法、钻抓法、抓取法、铣削法等，必要时可选多种设备组合施工", "槽孔的孔斜率不应大于<span class='hi'>4‰<\/span>", "墙体质量检查应在成墙<span class='hi'>28d<\/span>后进行，可采用钻孔取芯、注水试验等方法", "检查孔数量宜为每15～20个槽孔1个，位置应具有代表性"], "x": "28d 是成墙后的检查龄期；孔斜率是千分之四，不是百分之四。"}, {"t": "概念", "s": "3.3.1", "p": "P103", "n": "土料压实标准的控制指标", "k": ["黏性土用干密度和施工含水量控制", "非黏性土以相对密度Dr控制，现场通常转换成干密度控制", "石渣和堆石体可以用孔隙率作为压实指标", "土料颗粒越细孔隙比越大越不易压实，黏性土的干密度低于非黏性土"], "x": "堆石用孔隙率、砂砾用相对密度，两类指标最容易互换。"}, {"t": "计算", "s": "3.3.1", "p": "P103", "n": "压实参数的确定与碾压试验", "k": ["压实参数包括碾压机具重量、含水量、碾压遍数及铺土厚度，振动碾压还包括振动频率及行走速率", "确定参数前必须对土料场充分调查，选代表性料场进行碾压试验", "黏性土压实含水量取Wp、Wp、Wp-2%三种进行试验，Wp为土料塑限", "确定压实标准的合格率时，应略高于设计标准"], "x": "非黏性土不存在最优含水量，含水量不作专门控制，这是与黏性土的根本区别。"}, {"t": "计算", "s": "3.3.1", "p": "P103", "n": "最经济压实方案的比选", "k": ["绘制铺土厚度、压实遍数与干密度的关系曲线，按设计干密度查出对应遍数和最优含水量", "分别计算单位压实遍数的压实厚度，即h1/n1、h2/n2、h3/n3", "以单位压实遍数的压实厚度最大者为最经济合理方案"], "x": "比的是厚度除以遍数的比值，不是单看厚度或遍数，取最大不取最小。"}, {"t": "计算", "s": "3.3.1", "p": "P105", "n": "碾压机械的两种开行方式", "k": ["碾压机械的开行方式通常有进退错距法和圈转套压法两种", "进退错距法的错距宽度b=B/n，B为碾滚净宽、n为设计碾压遍数", "进退错距法操作简便、工序协调、便于分段流水作业，压实质量容易保证", "圈转套压法要求工作面较大，适合多碾滚组合，生产效率较高但转弯处易超压", "转弯半径小时易引起土层扭曲、产生剪力破坏，转弯四角容易漏压"], "x": "b=B/n 中n是设计碾压遍数；错距宽度越大越易漏压，不是越宽越好。", "fig": "ch03f04"}, {"t": "主体", "s": "3.3.1", "p": "P105", "n": "铺料与整平的要求", "k": ["铺料宜平行坝轴线进行，铺土厚度要匀，超径料块应打碎、杂物应剔除", "进入防渗体内铺料，自卸汽车宜用进占法倒退铺土，使汽车始终在松土上行驶", "坝面应设专用路口，防止不同土料混杂和超压产生剪切破坏", "心墙坝、斜墙坝铺筑应向上游倾斜1%～2%，均质坝中部凸起向两侧倾斜"], "x": "汽车在压实土层上开行会造成超压和剪力破坏，这是设路口的根本原因。"}, {"t": "主体", "s": "3.3.1", "p": "P106", "n": "土砂结合部的平起施工", "k": ["为保护黏土心墙、斜墙不致长时间暴露在大气中，一般采用土、砂平起的施工方法", "平起施工分为先土后砂法和先砂后土法两种", "土料边仍有一定宽度未被压实合格，可用气胎碾压实或采用夯实机具", "夯实土砂结合部宜先夯土边一侧，合格后再夯反滤料，不得交替夯实"], "x": "先夯土、后夯砂；交替夯实会破坏已压实的结合面，影响填筑质量。"}, {"t": "主体", "s": "3.3.1", "p": "P106", "n": "坝身与混凝土结构物的连接", "k": ["填土前先清除混凝土表面乳皮、粉尘及附着杂物，并在结合面上洒水湿润", "涂刷一层厚约<span class='hi'>3～5mm<\/span>的浓黏性土浆、水泥黏性土浆或水泥砂浆", "要边涂刷、边铺土、边碾压，涂刷高度与铺土厚度一致，不得在泥浆干涸后铺土", "泥浆土水质量比宜为1:3.0～1:2.5，填土含水率应大于最优含水率1%～3%"], "x": "靠近混凝土两侧及顶部0.5m范围内不能用大型机械，须小型机械或人工夯实。"}, {"t": "概念", "s": "3.3.2", "p": "P108", "n": "堆石坝坝体材料分区", "k": ["堆石坝坝体材料分区主要有垫层区、过渡区、主堆石区和下游堆石区", "垫层区位于上游面，起反滤与传力作用；过渡区设在垫层与主堆石之间", "主堆石区是坝体的主要承重部分，下游堆石区对密度的要求相对较低", "垫层料、过渡料和一定宽度主堆石的填筑应平起施工、均衡上升"], "x": "顺序为垫层—过渡—主堆石—下游堆石，过渡区不能放在垫层之前。", "fig": "ch03f05"}, {"t": "数字", "s": "3.3.2", "p": "P108", "n": "垫层料铺筑与堆石粒径控制", "k": ["垫层料铺筑上游边线水平超宽一般为<span class='hi'>20～30cm<\/span>，采用自行式振动碾压实", "水平碾压时，振动碾与上游边缘的距离不宜大于40cm", "垫层料每填筑升高10～15m，进行一次垫层坡面削坡修整和碾压", "堆石体最大粒径不应超过层厚的2/3；垫层料为80～100mm，过渡料不超过300mm"], "x": "2/3 是相对层厚的比值；下游堆石区最大粒径可达1000～1500mm。"}, {"t": "时间", "s": "3.4.1", "p": "P114", "n": "混凝土的拆模时间与强度要求", "k": ["非承重侧面模板，混凝土强度应达到<span class='hi'>25×10⁵Pa<\/span>以上且表面和棱角不因拆模损坏", "一般情况下，夏天需2～4d，冬天需5～7d", "悬臂板、梁：跨度≤2m达75%，跨度>2m达100%", "其他梁、板、拱：跨度≤2m达50%，2～8m达75%，跨度>8m达100%"], "x": "悬臂构件要求最高，跨度2m以内也要75%；拆模按先装后拆、后装先拆。"}, {"t": "数字", "s": "3.4.2", "p": "P117", "n": "钢筋检验的取样规定", "k": ["现场钢筋检验包括资料核查、外观检查和力学性能试验", "从每批钢筋中任选两根，每根取两个试件分别做拉伸试验和冷弯试验", "有一项不合格时另取<span class='hi'>双倍数量<\/span>试件重做，仍有一个不合格则该批不合格", "取样时端部先截去500mm；同一批号每60t宜作为一个检验批，不足60t仍按一批"], "x": "复试须另取双倍数量试件重做，不是把原试件重测一遍。"}, {"t": "数字", "s": "3.4.2", "p": "P117", "n": "钢筋代换的原则与限值", "k": ["应按钢筋承载力设计值相等的原则进行代换，并满足间距、锚固长度、最小直径等构造要求", "以高一级钢筋代换低一级钢筋时，宜采用改变钢筋直径的方法减少钢筋截面积", "用同牌号钢筋代换时，其直径变化范围不宜超过<span class='hi'>4mm<\/span>", "代换后总截面面积与设计截面面积之比不得小于98%或大于103%"], "x": "重要结构中的钢筋代换应征得设计单位同意，施工单位不得自行决定。"}, {"t": "计算", "s": "3.4.2", "p": "P116", "n": "箍筋与弯起钢筋的尺寸基准", "k": ["箍筋尺寸为内皮尺寸，计算下料时另加弯钩增加长度", "弯起钢筋的弯起高度为外皮尺寸，不是中心线尺寸", "单根钢筋的长度应为钢筋中心线的长度", "下料长度应根据结构尺寸、保护层厚度、钢筋弯曲调整值和弯钩增加长度确定"], "x": "箍筋量内皮、弯起高度量外皮、下料量中心线，三种基准最易混用。", "fig": "ch03f08"}, {"t": "程序", "s": "3.4.4", "p": "P121", "n": "施工缝的处理", "k": ["施工缝是浇筑块间临时的水平和垂直结合缝，也是新老混凝土的结合面", "必须用高压水枪或风砂枪清除老混凝土表面乳皮，使表层石子半露形成麻面", "高压水冲毛视气温可在浇筑后<span class='hi'>5～20h<\/span>进行，风砂枪打毛一般在浇筑后一两天", "对纵缝表面可不凿毛，但应冲洗干净，以利灌浆"], "x": "冲毛看小时、打毛看天数；纵缝只冲洗不凿毛，三点常被合并错记。"}, {"t": "数字", "s": "3.4.4", "p": "P122", "n": "平仓与振捣的要求", "k": ["振捣是保证混凝土密实的关键，应在平仓后立即进行", "振捣器应插入下层混凝土<span class='hi'>5～10cm<\/span>，以利于上、下层结合", "插入点距模板不应大于20cm，相邻插入点间距不应大于作用半径R的1.5～1.75倍", "作用半径R一般为30～50cm，每个插点振捣时间一般为20～30s"], "x": "振捣器平仓不能代替下一道振捣工序；过振会出现集料下沉、砂浆上翻离析。"}, {"t": "数字", "s": "3.4.4", "p": "P123", "n": "大体积混凝土浇筑层厚与间歇", "k": ["常态混凝土浇筑应采取短间歇均匀上升、分层浇筑的方法", "基础约束区浇筑层厚度宜为<span class='hi'>1.5～2.0m<\/span>，有初期通水冷却的可适当加厚", "基础约束区以上浇筑层厚度可采用1.5～3.0m", "浇筑层间歇期宜采用5～7d，宜在下层混凝土最高温度出现后开始浇筑上层"], "x": "约束区层厚上限更小，是为减小基础约束引起的温度应力，不是施工能力不足。", "fig": "ch03f09"}, {"t": "数字", "s": "3.4.4", "p": "P123", "n": "混凝土出机与浇筑温度控制", "k": ["水泥运至工地的入罐或入场温度不宜高于<span class='hi'>65℃<\/span>，细集料表面含水率不宜超过6%", "常态混凝土加冰率不宜超过总水量的70%，碾压混凝土不宜超过50%", "出拌合楼机口至振捣或碾压结束，温度回升值不宜超过5℃", "混凝土浇筑温度不宜大于<span class='hi'>28℃<\/span>"], "x": "70%与50%按常态、碾压区分；回升5℃与浇筑28℃是两个独立控制值。"}, {"t": "数字", "s": "3.4.4", "p": "P125", "n": "碾压混凝土的配合比参数", "k": ["掺合料掺量应通过试验确定，掺量超过<span class='hi'>65%<\/span>时应做专门试验论证", "水胶比应根据强度、抗渗性、抗冻性和拉伸变形等要求确定，其值宜不大于0.65", "使用天然砂石料时三级配砂率为28%～32%，二级配为32%～37%", "使用人工砂石料时砂率应相应增加；单位用水量可根据VC值等选定"], "x": "65%是掺合料掺量的论证界限，不是水胶比；水胶比上限才是0.65。"}, {"t": "数字", "s": "3.4.4", "p": "P126", "n": "碾压混凝土的铺筑与碾压", "k": ["碾压混凝土应采用大仓面薄层连续浇筑，铺筑方法宜采用平层通仓法", "也可采用斜层平推法，铺筑面积应与铺筑强度及允许层间间隔时间相适应", "碾压条带间搭接宽度为<span class='hi'>10～20cm<\/span>，端头部位搭接宽度宜为100cm左右", "振动碾的行走速度应控制在1.0～1.5km/h"], "x": "坝体迎水面3～5m范围内，碾压方向应垂直于水流方向，不是平行。"}, {"t": "概念", "s": "3.4.5", "p": "P131", "n": "水平止水与垂直止水的构造", "k": ["水平止水大都采用塑料（或橡胶）止水带，其安装与填料的安装方法一样", "垂直止水的金属片，重要部分用紫铜片，一般用铝片、镀锌铁皮或镀铜铁皮", "需灌注沥青的垂直止水可预制混凝土槽板，每节长度0.3～0.5m，接触面应凿毛", "止水交叉分铅直交叉与水平交叉，铅直交叉常用柔性连接，水平交叉多用刚性连接"], "x": "垂直止水靠沥青井适应变形、水平止水靠止水带，两种构造不能互换套用。", "fig": "ch03f10"}, {"t": "主体", "s": "3.4.5", "p": "P132", "n": "止水缝部位的混凝土浇筑", "k": ["水平止水片应在浇筑层的中间，在止水片高程处，不得设置施工缝", "浇筑混凝土时不得冲撞止水片，混凝土将要淹没止水片时应再次清除其表面污垢", "振捣器不得触及止水片，以免损坏止水片或造成移位", "嵌固止水片的模板应适当推迟拆模时间"], "x": "在止水片高程处设施工缝是最典型错误，渗水会沿该缝形成贯通通道。"}, {"t": "概念", "s": "3.4.5", "p": "P132", "n": "混凝土坝的分缝分块", "k": ["沿坝轴线方向将坝的全长划分为<span class='hi'>15～24m<\/span>的若干坝段，坝段之间的缝称为横缝", "重力坝横缝一般不需接缝灌浆，称永久缝；拱坝横缝需灌浆，称临时缝", "每个坝段可用纵缝（竖缝、斜缝、错缝）分成若干坝块，或整段通仓浇筑", "分缝分块根据坝高、坝型、结构要求、施工条件、环境温度等因素布置"], "x": "重力坝横缝是永久缝、拱坝横缝是临时缝，这一对最容易被写反。", "fig": "ch03f12"}, {"t": "程序", "s": "3.5.2", "p": "P142", "n": "平面闸门的安装顺序", "k": ["安装第一步是将闸门吊放到门底坎上就位", "按照预埋件调整止水和支承导向部件，保证止水位置准确", "安装闸门拉杆，并在门槽内试验闸门的提升和关闭", "将闸门处于试验水头并投入试运行，检查运行情况"], "x": "弧形闸门顺序是支臂吊装、穿铰轴、门叶吊装、门叶与支臂相连，两者不可混。"}, {"t": "数字", "s": "3.5.2", "p": "P142", "n": "闸门安装试验与漏水量", "k": ["闸门安装合格后，应在无水情况下作全行程启闭试验", "试验前应清除门叶上和门槽内所有杂物，启闭时在止水橡皮处浇水润滑", "有条件时工作闸门应作动水启闭试验，事故闸门应作动水关闭试验", "承受设计水头压力时，任意1m长度水封范围内漏水量不应超过<span class='hi'>0.1L/s<\/span>"], "x": "漏水量按每米水封计，不是全闸总量；止水压缩检查不应有透亮或间隙。"}, {"t": "数字", "s": "3.5.2", "p": "P144", "n": "启闭机试验的类型与荷载", "k": ["空运转试验是启闭机出厂前在未安装钢丝绳和吊具的组装状态下进行的试验", "空载试验是启闭机在无荷载状态下进行的运行试验和模拟操作", "动载试验在<span class='hi'>1.1倍<\/span>额定荷载下进行，检查起升机构、运行机构和制动器", "静载试验在<span class='hi'>1.25倍<\/span>额定荷载下进行，检验各部件和金属结构的承载能力"], "x": "动载1.1倍、静载1.25倍；动载在前静载在后，两个倍数不可对调。"}, {"t": "主体", "s": "3.6.1", "p": "P147", "n": "水闸混凝土的施工原则", "k": ["水闸主体结构混凝土施工宜按照先深后浅、先重后轻、先高后矮、先主后次的原则", "施工缝位置应设在结构受力较小、易于处理、对外观质量影响较小的部位", "混凝土强度达到<span class='hi'>2.5MPa<\/span>后方可浇筑上层，水平缝铺10～20mm同配比水泥砂浆", "同一块底板上浇筑数个闸墩时，各闸墩的混凝土浇筑面应均衡上升", "高温季节混凝土出机温度不应超过30℃，入仓温度不应超过35℃"], "x": "冬期入仓温度不宜低于5℃、仓面不宜低于3℃，拌和用水温度不宜超过60℃。"}, {"t": "数字", "s": "3.6.2", "p": "P154", "n": "堤防碾压的搭接与行走速度", "k": ["碾压机械的行走方向应平行于堤轴线", "相邻作业面搭接：顺碾压方向宽度不小于<span class='hi'>3.0m<\/span>，垂直碾压方向不小于0.5m", "振动碾压实宜采用进退错距法，碾迹搭压宽度应大于0.10m", "机械碾压行进速度不超过4km/h，宜采用2～3km/h"], "x": "3.0m是顺碾压方向、0.5m是垂直方向；堤身接缝跨缝搭接碾压也用3.0m。"}, {"t": "程序", "s": "3.6.3", "p": "P160", "n": "橡胶坝坝袋的安装顺序", "k": ["双锚线锚固型坝袋按先下游、后上游、最后岸墙的顺序安装", "应从坝袋底板中心线开始，向两侧同时进行安装", "锚固岸（坡）墙时宜先将胶布挂起、撑平，再从下部往上部锚固", "单锚线锚固型只有上游一条锚固线，从底板中心线开始向两侧同时安装"], "x": "压板要首尾对齐，卷入压轴的对接缝应与压板接缝错开，防止出现软缝漏水。"}], "figs": {"ch03f10": {"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAYAAAFLCAAAAABgz9EQAADTRUlEQVR42uz9d3hcV5Yfiq619z6pcqEKGSBAEMw5k6JIico5tdRqdWs6zZ3QM2N7bI+v7Xvn3vve82f7+ruemffssWc8M+3p6ahOyjlQgRJFkRQpiTmAATlXDifsvd4fBYAACJAgJWKaVK3v6xYJoqpOnbP3b6/wW7+FBGUrW9l+o4wAcFY/kJXvednK9mW3MgyUrWxfesNyUFC2spW9gbKVrWxlGChb2cpWhoGyla1sZRgoW9nKVoaBspWtbGUYKFvZylaGgbKVrWxlGChb2cpWhoGyla1sZRgoW9nKVoaBspWtbGUYKFvZylaGgbKVrWxlGChb2cpWhoGyla1sZRgoW9nKVoaBspWtbGUYKFvZylaGgbKVrWxfKhPlW/AFmCSOCgFmW1e6bGWDsiTpb44pF5FjGQbKVg4KvsTugFNUvAwBZSsHBV9eI/fQ/r75m+vLzkDZykHBlxcGXnzPSQ3d8M1aLONA2crewJfUjnz8eH3q6XfrnwQqw0DZyt7Al9OOirke7/mL3J/5y7mWspW9gS+pLSDQoCIes1yjfDNmLxSToux8QblS8JvjUiGSGsyuZ7J8L2YNBAhEORNT9gZ+o2AAyDlds4rp5XsxeygAJLFcpC17A785axJsHEreFC+D6qzdcKD8/lMOIkA5uVX2Bn5DvAGP9e+c2+p55dTAbPkC2ef3HOV3PTQHsewPlGHgN8SUfEesQi5J8fLNmI377Tz75n1rjj8T/qpVzg+UYeA3xJzCT+Cxgtfln1e+F7PjDDg1f9rCjw9+eFttGXfLMPAbsiozr79SO2gNJ/9VuVIwW2HY+hDCnPVvO2VfAMopwt8Ekwr7B1Y6g1mxtEmWV+WsgAAzTQAQgQYfK9/xsjfwGxGnMpj7LVXQDALi5bT17BxeugKgoY71USzzt8sw8JsAAlyiaQEAgCd1Vb4js+IOAFee6A7cYJSbOssw8BuQq2JwvjggoJwbmD38FR2nttaU70M5N/CPtvmVUqM0FrLfSI/9HE+0le/ObECAUh70PV8711NKleOwMgxcRZba6HlP4354fsOP3j3V93JqlMEi5aHjEggAFACBIlBljtvVgQGEMz9fdaPFB5RHV28NXOIH5aDgywAFOPb4cdx/CRBASeSIAKR4X56ASpxW5Z2aI3kpSFCKKYYEF2awqBzOfv7ueK/7KVXYkclF77D12UABAqTrORdZhoEpnz+NbngEUCVVBkJQCKAQ+rQoISoGoAisOq5GfCqF0QgvuRKEHJiUWmkBlRSLz+9/Gk10le3KYECe/PkuOBzvMP+ULLr8O0njk42TfoiT/cGxJBCWvYEvFw4gKiVIIQI4AMA4EIDUSDEAyfH   return DATA.filter(d=>{
    if(activeType !== "全部" && d.t !== activeType) return false;
    if(!kw) return true;
    const hay = (d.n + " " + d.s + " " + d.p + " " + d.k.join(" ") + " " + (d.x||"")).replace(/<[^>]+>/g,"").toLowerCase();
    return hay.includes(kw);
  });
}

function chipHTML(){
  const counts = {};
  TYPES.forEach(t=>counts[t] = DATA.filter(d=>d.t===t).length);
  const items = [["全部", DATA.length], ...TYPES.filter(t=>counts[t]).map(t=>[t,counts[t]])];
  return items.map(([t,n])=>
    `<button class="chip${t===activeType?" on":""}" data-t="${t}">${t}<span class="n">${n}</span></button>`
  ).join("");
}
function bindChips(box){
  box.querySelectorAll(".chip").forEach(b=>{
    b.onclick = ()=>{ activeType = b.dataset.t; cur = 0; renderChips(); renderGrid(); renderCard(); };
  });
}
function renderChips(){
  const a = $("chips"), b = $("chips2");
  if(a){ a.innerHTML = chipHTML(); bindChips(a); }
  if(b){ b.innerHTML = chipHTML(); bindChips(b); }
}

/* ---------------- 索引模式 ---------------- */
function renderGrid(){
  const rows = filtered();
  const kw = keyword.trim();
  $("total").textContent = DATA.length;
  $("stats").innerHTML = (kw || activeType!=="全部")
    ? `筛选出 <b>${rows.length}</b> 张考点卡` + (kw?`，关键词「${kw.replace(/</g,"&lt;")}」`:"") + `　·　共 ${DATA.length} 张`
    : `共 <b>${DATA.length}</b> 张考点卡　·　${BANK.summary}`;

  $("empty").style.display = rows.length ? "none" : "block";
  $("list").innerHTML = rows.map(d=>`
    <div class="card t-${d.t}">
      <div class="card-top">
        <span class="tag">${d.t}</span>
        <span class="sec">${d.s||""}</span>
        ${d.fig && FIGS[d.fig] ? '<span class="fmark">配图</span>' : ''}
        <span class="pg">${d.p||""}</span>
      </div>
      <h3>${d.n}</h3>
      <div class="body">
        <ul>${d.k.map(x=>`<li>${x}</li>`).join("")}</ul>
        ${figHTML(d)}
        ${d.x?`<div class="trap">${d.x}</div>`:""}
      </div>
      <div class="more">点击展开 ▾</div>
    </div>`).join("");

  $("list").querySelectorAll(".card").forEach(c=>{
    c.onclick = (e)=>{ if(e.target.closest(".figbox")) return; c.classList.toggle("open"); };
  });
  bindZoom($("list"));
}

/* ---------------- 知识卡片模式 ---------------- */
function renderCard(){
  const rows = filtered();
  const box = $("kcard");
  $("posAll").textContent = rows.length || 0;

  if(!rows.length){
    box.className = "kcard";
    box.innerHTML = `<div class="kc-empty">当前筛选下没有卡片</div>`;
    $("pos").textContent = "0";
    $("posfill").style.width = "0%";
    $("prev").disabled = $("next").disabled = true;
    return;
  }
  if(cur >= rows.length) cur = rows.length - 1;
  if(cur < 0) cur = 0;

  const d = rows[cur];
  box.className = "kcard t-" + d.t;
  box.innerHTML = `
    <div class="kc-top">
      <span class="tag">${d.t}</span>
      <span class="sec">${d.s||""}</span>
      <span class="pg">${d.p||""}</span>
    </div>
    <h2 class="kc-title">${d.n}</h2>
    <ul class="kc-list">${d.k.map(x=>`<li>${x}</li>`).join("")}</ul>
    ${figHTML(d, true)}
    ${d.x?`<div class="kc-trap">${d.x}</div>`:""}
  `;
  box.scrollTop = 0;
  box.classList.remove("anim"); void box.offsetWidth; box.classList.add("anim");

  $("pos").textContent = cur + 1;
  $("posfill").style.width = ((cur+1)/rows.length*100).toFixed(1) + "%";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === rows.length - 1;
  bindZoom(box);
  try{ localStorage.setItem("kb_pos_ch"+CH, cur); }catch(e){}
}

function go(n){
  const rows = filtered();
  if(!rows.length) return;
  const t = cur + n;
  if(t < 0 || t >= rows.length) return;
  cur = t; renderCard();
}

/* ---------------- 灯箱 ---------------- */
function bindZoom(scope){
  scope.querySelectorAll(".figbox img").forEach(img=>{
    img.onclick = (e)=>{
      e.stopPropagation();
      const F = FIGS[img.dataset.fig] || {};
      $("lbimg").src = F.src || img.src;
      $("lbtx").textContent = F.cap || "";
      $("lb").classList.add("on");
    };
  });
}
function closeLB(){ $("lb").classList.remove("on"); }
$("lb").onclick = closeLB;
$("lbclose").onclick = (e)=>{ e.stopPropagation(); closeLB(); };

/* ---------------- 模式切换 ---------------- */
function setMode(m){
  mode = m;
  document.querySelectorAll(".mtab").forEach(b=>b.classList.toggle("on", b.dataset.mode===m));
  $("gridView").style.display = m==="grid" ? "block" : "none";
  $("cardView").style.display = m==="card" ? "block" : "none";
  if(m==="card"){
    if(!window.__restored){
      const saved = (window.__posParam != null)
        ? window.__posParam
        : parseInt(localStorage.getItem("kb_pos_ch"+CH)||"0", 10);
      const rows = filtered();
      cur = Math.min(Math.max(saved||0,0), Math.max(rows.length-1,0));
      window.__restored = true;
    }
    renderCard();
    window.scrollTo({top:0, behavior:"auto"});
  }else{
    renderGrid();
  }
  try{ localStorage.setItem("kb_mode", m); }catch(e){}
}
document.querySelectorAll(".mtab").forEach(b=>{
  b.onclick = ()=> setMode(b.dataset.mode);
});

/* ---------------- 事件 ---------------- */
$("q").addEventListener("input", e=>{
  keyword = e.target.value; cur = 0; renderGrid();
  if(mode==="card") renderCard();
});
$("prev").onclick = ()=> go(-1);
$("next").onclick = ()=> go(1);

document.addEventListener("keydown", e=>{
  if($("lb").classList.contains("on")){
    if(e.key === "Escape") closeLB();
    return;
  }
  const inInput = document.activeElement && document.activeElement.tagName === "INPUT";
  if(e.key === "/" && !inInput && mode==="grid"){
    e.preventDefault(); $("q").focus(); return;
  }
  if(mode === "card" && !inInput){
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key === "ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key === " "){ e.preventDefault(); setMode("grid"); }
    else if(e.key === "Escape"){ setMode("grid"); }
  }
});

/* 触摸滑动（图片上不触发，避免与放大冲突） */
let tx = 0, ty = 0;
const stage = document.querySelector(".stage-body");
stage.addEventListener("touchstart", e=>{
  if(e.target.closest(".figbox")) return;
  tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
}, {passive:true});
stage.addEventListener("touchend", e=>{
  if(e.target.closest(".figbox")) return;
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.6) go(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------------- 初始化 ---------------- */
renderChips();
renderGrid();
let initMode = "grid";
try{ initMode = localStorage.getItem("kb_mode") || "grid"; }catch(e){}
const sp = new URLSearchParams(location.search);
if(sp.get("mode")) initMode = sp.get("mode");
if(sp.get("i") != null) window.__posParam = Math.max(parseInt(sp.get("i"), 10) || 0, 0);
setMode(initMode);
</script>
<script src="../nav.js" defer></script>
</body>
</html>
